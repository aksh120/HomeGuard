<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="strokeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2" />

  <g filter="url(#softGlow2)">
    <!-- Outer Protective Shield Perimeter (Continuous Precision Stroke) -->
    <path d="M 256 88 
             L 376 156 
             L 376 276 
             C 376 364 308 424 256 444 
             C 204 424 136 364 136 276 
             L 136 156 Z" 
          fill="none" 
          stroke="url(#strokeGrad2)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Floating Architectural Haven (Minimalist Gable & Core) -->
    <path d="M 256 180 
             L 320 236 
             L 320 332 
             C 320 354 288 376 256 384 
             C 224 376 192 354 192 332 
             L 192 236 Z" 
          fill="#10B981" 
          fill-opacity="0.12" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linejoin="round" />

    <!-- Center Sentinel Keystone -->
    <circle cx="256" cy="276" r="18" fill="#10B981" />
    <path d="M 256 304 L 256 348" stroke="#10B981" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
