<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>
    <linearGradient id="wingLeftGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="wingRightGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="roofGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="softDepth4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad4)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2" />

  <g filter="url(#softDepth4)">
    <!-- Left Guard Wing (Emerald Protection) -->
    <path d="M 244 116 
             L 140 176 
             L 140 284 
             C 140 360 196 414 244 434 
             L 244 340 
             L 188 300 
             L 188 206 
             L 244 172 Z" 
          fill="url(#wingLeftGrad4)" />

    <!-- Right Guard Wing (Blue Monitoring Connection) -->
    <path d="M 268 116 
             L 372 176 
             L 372 284 
             C 372 360 316 414 268 434 
             L 268 340 
             L 324 300 
             L 324 206 
             L 268 172 Z" 
          fill="url(#wingRightGrad4)" />

    <!-- Central Floating Haven Chevron (Home Sanctuary) -->
    <path d="M 256 160 
             L 296 196 
             L 296 284 
             L 256 312 
             L 216 284 
             L 216 196 Z" 
          fill="url(#roofGrad4)" />

    <!-- Core Safety Heart (Inner Emerald Glow) -->
    <circle cx="256" cy="240" r="16" fill="#10B981" />
  </g>
</svg>
