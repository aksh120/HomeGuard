<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="darkFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="subtleGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)" />

  <!-- Subtle Inner Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1F2937" stroke-width="2" />

  <!-- Shield & House Monolith Group -->
  <g filter="url(#subtleGlow1)">
    <!-- Left Shield Wing (Lighter Facet) -->
    <path d="M 256 96 
             L 132 168 
             L 132 292 
             C 132 374 200 428 256 448 
             L 256 96 Z" 
          fill="url(#facetGrad1)" />

    <!-- Right Shield Wing (Deeper Facet for Angular Volume) -->
    <path d="M 256 96 
             L 380 168 
             L 380 292 
             C 380 374 312 428 256 448 
             L 256 96 Z" 
          fill="url(#darkFacet1)" />

    <!-- Geometric Negative Space Roof & Hearth Core -->
    <!-- Pitched Roofline -->
    <path d="M 256 164 
             L 184 224 
             L 204 240 
             L 256 196 
             L 308 240 
             L 328 224 Z" 
          fill="#0B0F19" />

    <!-- Pure Central Safety Core (Sanctuary Pillar) -->
    <path d="M 220 252 
             L 292 252 
             L 292 344 
             C 292 370 274 388 256 394 
             C 238 388 220 370 220 344 Z" 
          fill="#0B0F19" />

    <!-- Inner Core Beacon Pulse (Pure White Sanctuary Spark) -->
    <path d="M 256 276 
             L 272 292 
             L 256 348 
             L 240 292 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
