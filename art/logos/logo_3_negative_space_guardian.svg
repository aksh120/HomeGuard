<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#141D2E" />
    </linearGradient>
    <linearGradient id="shieldFill3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="crispShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#223049" stroke-width="2" />

  <g filter="url(#crispShadow3)">
    <!-- Solid Master Shield with Cutout Mask -->
    <mask id="shieldMask3">
      <!-- White reveals everything -->
      <rect width="512" height="512" fill="#FFFFFF" />

      <!-- Black cuts out negative space: Roof Gable + Keyhole Sanctuary -->
      <!-- Negative Space Roof -->
      <path d="M 256 168 
               L 180 236 
               L 204 260 
               L 256 214 
               L 308 260 
               L 332 236 Z" 
            fill="#000000" />

      <!-- Negative Space Circular Beacon / Keyhole Top -->
      <circle cx="256" cy="272" r="28" fill="#000000" />

      <!-- Negative Space Haven Pillar / Keyhole Shaft -->
      <path d="M 240 286 
               L 272 286 
               L 282 368 
               C 282 380 270 388 256 388 
               C 242 388 230 380 230 368 Z" 
            fill="#000000" />
    </mask>

    <!-- Outer Shield Body -->
    <path d="M 256 84 
             L 384 156 
             L 384 280 
             C 384 376 314 436 256 456 
             C 198 436 128 376 128 280 
             L 128 156 Z" 
          fill="url(#shieldFill3)" 
          mask="url(#shieldMask3)" />

    <!-- Pure Center Beacon Light (The Protected Resident / Hearth) -->
    <circle cx="256" cy="272" r="14" fill="#FFFFFF" />
  </g>
</svg>
