<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="facetTop5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="facetRight5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="facetLeft5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="isoGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#10B981" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad5)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1F2937" stroke-width="2" />

  <g filter="url(#isoGlow5)">
    <!-- Outer Shield Boundary Ring (Subtle Architectural Wall) -->
    <path d="M 256 80 
             L 396 156 
             L 396 288 
             C 396 384 320 440 256 460 
             C 192 440 116 384 116 288 
             L 116 156 Z" 
          fill="none" 
          stroke="#1F2937" 
          stroke-width="12" />

    <!-- Isometric Roof Left Slope -->
    <polygon points="256,140 160,196 256,252 352,196" fill="url(#facetTop5)" />

    <!-- Isometric Left Wall (House Foundation) -->
    <polygon points="160,196 256,252 256,368 160,312" fill="url(#facetLeft5)" />

    <!-- Isometric Right Wall (Deeper Shadow) -->
    <polygon points="256,252 352,196 352,312 256,368" fill="url(#facetRight5)" />

    <!-- Isometric Central Beacon Chimney/Aegis Core -->
    <polygon points="256,204 280,218 280,246 256,232" fill="#FFFFFF" />
    <polygon points="256,204 232,218 232,246 256,232" fill="#E2E8F0" />
    <polygon points="256,188 280,202 256,216 232,202" fill="#FFFFFF" />

    <!-- Lower Protective Shield Apex Accent -->
    <path d="M 200 404 C 224 424 256 438 256 438 C 256 438 288 424 312 404" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="8" 
          stroke-linecap="round" />
  </g>
</svg>
