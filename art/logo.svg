<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10B981" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2" />

  <g filter="url(#cleanGlow)">
    <!-- Top Primary Roof Chevron (Shelter / Haven) -->
    <path d="M 256 104 
             L 384 180 
             L 348 202 
             L 256 148 
             L 164 202 
             L 128 180 Z" 
          fill="#FFFFFF" />

    <!-- Secondary Interlocking Shield Chevron -->
    <path d="M 256 180 
             L 384 256 
             L 384 300 
             C 384 374 316 426 256 448 
             C 196 426 128 374 128 300 
             L 128 256 
             L 256 180 Z" 
          fill="url(#chevronGrad)" />

    <!-- Center Cutout Haven Window (Negative Space Geometrics) -->
    <path d="M 256 244 
             L 320 286 
             L 320 348 
             C 320 372 284 394 256 404 
             C 228 394 192 372 192 348 
             L 192 286 Z" 
          fill="#0F172A" />

    <!-- Central Reassuring Beacon Core (Glowing Core) -->
    <circle cx="256" cy="328" r="18" fill="#FFFFFF" />
  </g>
</svg>
